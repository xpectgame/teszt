<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css">
<style>
/* A bolti ikon: tányér felülnézetből, benne levél. A Play nem fogad el
   átlátszó vagy előre lekerekített ikont, ezért tele négyzet. */
.icon { width: 512px; height: 512px;
  background: radial-gradient(120% 120% at 30% 22%, #2E6B3E 0%, #1B5E20 55%, #123F17 100%);
  display: flex; align-items: center; justify-content: center; }
.icon svg { width: 356px; height: 356px; display: block;
  filter: drop-shadow(0 10px 26px rgba(0,0,0,.25)); }
/* Olvashatóság-próba: ugyanez a jel telefonos méretben. */
.proba { display: flex; gap: 16px; align-items: center; padding: 20px; background: #EEE; }
.proba .k { background: #1B5E20; display: flex; align-items: center; justify-content: center; }
.k48 { width: 48px; height: 48px; border-radius: 11px; }
.k48 svg { width: 34px; height: 34px; }
.k72 { width: 72px; height: 72px; border-radius: 16px; }
.k72 svg { width: 50px; height: 50px; }
.k96 { width: 96px; height: 96px; border-radius: 22px; }
.k96 svg { width: 67px; height: 67px; }
</style></head><body>
<div class="icon"><svg viewBox="0 0 108 108" xmlns="http://www.w3.org/2000/svg"><circle cx="54" cy="54" r="35" fill="#FBFDF7"/><path fill="#2E6B3E" d="M72,36C72,55.9 55.9,72 36,72C36,52.1 52.1,36 72,36z"/><path fill="#B4F0BD" d="M38.2,71.2l-1.4,-1.4l32,-32l1.4,1.4z"/></svg></div>
<div class="proba">
  <div class="k k48"><svg viewBox="0 0 108 108" xmlns="http://www.w3.org/2000/svg"><circle cx="54" cy="54" r="35" fill="#FBFDF7"/><path fill="#2E6B3E" d="M72,36C72,55.9 55.9,72 36,72C36,52.1 52.1,36 72,36z"/><path fill="#B4F0BD" d="M38.2,71.2l-1.4,-1.4l32,-32l1.4,1.4z"/></svg></div><div class="k k72"><svg viewBox="0 0 108 108" xmlns="http://www.w3.org/2000/svg"><circle cx="54" cy="54" r="35" fill="#FBFDF7"/><path fill="#2E6B3E" d="M72,36C72,55.9 55.9,72 36,72C36,52.1 52.1,36 72,36z"/><path fill="#B4F0BD" d="M38.2,71.2l-1.4,-1.4l32,-32l1.4,1.4z"/></svg></div><div class="k k96"><svg viewBox="0 0 108 108" xmlns="http://www.w3.org/2000/svg"><circle cx="54" cy="54" r="35" fill="#FBFDF7"/><path fill="#2E6B3E" d="M72,36C72,55.9 55.9,72 36,72C36,52.1 52.1,36 72,36z"/><path fill="#B4F0BD" d="M38.2,71.2l-1.4,-1.4l32,-32l1.4,1.4z"/></svg></div>
</div>
</body></html>
