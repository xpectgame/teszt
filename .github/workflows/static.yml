# A nyilvános oldalak (jogi tájékoztatók, támogatás) kiadása GitHub Pages-re.
#
# Ez a TARTALÉK út. Rendes esetben a Cloudflare Worker szolgálja ki ugyanezeket az
# oldalakat, a backenddel egy deployban — lásd docs/DOMAIN.md.
#
# Korábban két workflow deployolt ugyanide (ez és egy Jekyll-es), és találomra az
# nyert, amelyik később végzett. A Jekyll fölösleges: a lapok sima HTML-ek, nincs
# mit generálni rajtuk.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "mealpilot/**"
      - "index.html"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Csak az oldal megy ki, nem az egész repó. Korábban a `path: '.'` a forrást,
      # a Gradle-t és a node_modules-t is kitette — lassú, és semmi köze az oldalhoz.
      - name: Az oldal összeállítása
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r mealpilot _site/
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
