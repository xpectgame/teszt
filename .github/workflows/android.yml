name: Build

# A GitHub futtatói tartalmazzák az Android SDK-t, így itt tényleg lefordul az app,
# és a kész debug APK letölthető a futás Artifacts szekciójából — nem kell hozzá
# Android Studio a gépre.
on:
  push:
    branches: ["main", "claude/**"]
    paths:
      - "android/**"
      - "backend/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "backend/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: A számítási mag tesztjei
        run: ./gradlew :core:test

      - name: Debug APK
        env:
          MEALPILOT_BUILD: "build ${{ github.run_number }}"
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: APK feltöltése
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mealpilot-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Riportok hiba esetén
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            android/*/build/reports
            android/*/build/test-results
          if-no-files-found: ignore

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Függőségek
        run: npm ci

      - name: Típusellenőrzés
        run: npm run typecheck

      - name: Tesztek
        run: npm test
