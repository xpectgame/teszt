name: Build

# A GitHub futtatói tartalmazzák az Android SDK-t, így itt tényleg lefordul az app,
# és a kész debug APK letölthető a futás Artifacts szekciójából — nem kell hozzá
# Android Studio a gépre.
on:
  push:
    branches: ["main", "claude/**"]
    paths:
      - "android/**"
      - "backend/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "backend/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: A számítási mag tesztjei
        run: ./gradlew :core:test

      # Az :app tesztjei. Amíg ez a lépés nem volt, a CI csak azt bizonyította, hogy a
      # kód LEFORDUL — a képernyők, a ViewModelek és a tárolók viselkedéséről semmit.
      # A legutóbbi három hiba mind ott élt: egy szétesett elrendezés, egy összeomlás
      # és egy beszélgetés, ami azt állította, elvégezte a munkát.
      #
      # A tesztek Robolectrickel JVM-en futnak, tehát nem kell hozzájuk emulátor.
      #
      # --stacktrace NÉLKÜL: egy elbukó teszt mellé a Gradle kétszáz sornyi belső
      # vermet írt, amiben az egyetlen érdemi sor — melyik teszt és milyen kivétellel
      # bukott — elveszett.
      - name: Az app tesztjei
        run: ./gradlew :app:testDebugUnitTest

      - name: Debug APK
        env:
          MEALPILOT_BUILD: "build ${{ github.run_number }}"
        run: ./gradlew :app:assembleDebug --stacktrace

      # A lint eddig CSAK a kiadási buildben futott (lintVitalRelease), négy perccel
      # később és szűkebb körrel — a legutóbbi három hibából az egyiket ez engedte át
      # egészen a kiadásig. Itt a teljes ellenőrzés fut, a gyors úton.
      #
      # Figyelmeztetésre nem bukik el, csak hibára: a cél a valódi baj kiszűrése, nem
      # az, hogy egy stílusészrevétel megállítsa a munkát.
      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      # A backend címe a gradle.properties-ből jön, tehát a debug APK-ba be KELL kerülnie.
      # Ha valaki elírja vagy törli a beállítást, az app csendben visszaesne a saját
      # kulcsot kérő fejlesztői útra — a telepítőn semmi nem látszana belőle.
      - name: A backend címe bekerült az APK-ba
        run: |
          generated=$(find app/build/generated/source/buildConfig -name BuildConfig.java | head -1)
          if [ -z "$generated" ]; then
            echo "HIBA: nem találom a generált BuildConfig fájlt."
            exit 1
          fi
          if ! grep -q 'BACKEND_URL = "https://' "$generated"; then
            echo "HIBA: a BACKEND_URL üres vagy nem https címre mutat."
            grep BACKEND_URL "$generated" || true
            exit 1
          fi
          grep BACKEND_URL "$generated"

      # A Play kötelezően kér egy betöltő adatvédelmi címet, ezért kiadási build nem
      # készülhet cím nélkül. A védelem csak kiadáskor lép működésbe, tehát pont akkor
      # derülne ki, hogy elromlott, amikor a legdrágább — ezért próbáljuk itt. A címnek
      # már van alapértéke, így a próbához KIÜRÍTJÜK: ez mutatja meg, hogy a hibaág maga
      # működik-e még. A --dry-run felépíti a feladatgráfot, de nem futtat semmit, így
      # ez másodpercekbe kerül.
      - name: Kiadási build jogi cím nélkül nem mehet ki
        run: |
          if ./gradlew :app:assembleRelease --dry-run -Pmealpilot.backendUrl= > guard.log 2>&1; then
            echo "HIBA: a kiadási build cím nélkül is elindult."
            cat guard.log
            exit 1
          fi
          if ! grep -q "jogi oldalak címe" guard.log; then
            echo "HIBA: a build elszállt, de nem a várt okból."
            cat guard.log
            exit 1
          fi
          echo "Rendben: cím nélkül a kiadási build megáll."

      # A kiadási build eddig SEHOL nem futott le. Pedig csak ott fut az R8: a
      # kódzsugorítás reflexióval elért osztályokat tud kidobni, tehát a szerializáció
      # vagy a Room a boltba feltöltött csomagban romlana el először, debugban soha.
      # Aláíró kulcs nélkül aláíratlan APK készül — a Play nem fogadná el, de az R8
      # ugyanúgy végigfut rajta, és ez itt a lényeg.
      - name: Kiadási build (R8 próba)
        env:
          MEALPILOT_BACKEND_URL: https://ci.example.invalid
        run: ./gradlew :app:assembleRelease --stacktrace

      # A séma MOST MÁR a repóban van (app/schemas). Ez az a fájl, amihez a
      # következő verzió migrációját írni kell: enélkül csak tippelni lehetne,
      # milyen táblák vannak a felhasználók telefonján.
      #
      # Ezért nem elég feltölteni — egyeznie is kell. Ha valaki hozzányúl egy
      # @Entity-hez és elfelejti emelni az adatbázis verzióját, az itt bukik el,
      # nem a felhasználó telefonján egy migrációs hibával.
      - name: Az adatbázis-séma egyezzen a verziókezelttel
        if: success()
        run: |
          if git diff --quiet -- app/schemas; then
            echo "Rendben: a lefordított séma megegyezik a repóban lévővel."
            exit 0
          fi
          echo "HIBA: a lefordított séma eltér a verziókezelttől."
          git diff --stat -- app/schemas
          echo
          echo "Ha az adatbázis szándékosan változott: emeld a verziót, írj migrációt,"
          echo "és tedd be az új sémafájlt. Az alábbi blokk a friss séma, base64-ben:"
          sha256sum app/schemas/*/*.json
          tar czf - app/schemas | base64 -w 100
          exit 1

      # Letölthetően is, hogy egy külső eszközzel (például sémaösszehasonlítóval)
      # se kelljen a repót klónozni hozzá.
      - name: Adatbázis-séma feltöltése
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: android/app/schemas
          if-no-files-found: warn

      - name: APK feltöltése
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mealpilot-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Riportok hiba esetén
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            android/*/build/reports
            android/*/build/test-results
          if-no-files-found: ignore

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Függőségek
        run: npm ci

      - name: Típusellenőrzés
        run: npm run typecheck

      - name: Tesztek
        run: npm test
