name: Build

# A GitHub futtatói tartalmazzák az Android SDK-t, így itt tényleg lefordul az app,
# és a kész debug APK letölthető a futás Artifacts szekciójából — nem kell hozzá
# Android Studio a gépre.
on:
  push:
    branches: ["main", "claude/**"]
    paths:
      - "android/**"
      - "backend/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "backend/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: A számítási mag tesztjei
        run: ./gradlew :core:test

      - name: Debug APK
        env:
          MEALPILOT_BUILD: "build ${{ github.run_number }}"
        run: ./gradlew :app:assembleDebug --stacktrace

      # A lint eddig CSAK a kiadási buildben futott (lintVitalRelease), négy perccel
      # később és szűkebb körrel — a legutóbbi három hibából az egyiket ez engedte át
      # egészen a kiadásig. Itt a teljes ellenőrzés fut, a gyors úton.
      #
      # Figyelmeztetésre nem bukik el, csak hibára: a cél a valódi baj kiszűrése, nem
      # az, hogy egy stílusészrevétel megállítsa a munkát.
      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      # A védelem csak kiadáskor lép működésbe, tehát pont akkor derülne ki, hogy
      # elromlott, amikor a legdrágább. A --dry-run felépíti a feladatgráfot, de nem
      # futtat semmit, így ez másodpercekbe kerül.
      - name: Kiadási build jogi cím nélkül nem mehet ki
        run: |
          if ./gradlew :app:assembleRelease --dry-run > guard.log 2>&1; then
            echo "HIBA: a kiadási build cím nélkül is elindult."
            cat guard.log
            exit 1
          fi
          if ! grep -q "jogi oldalak címe" guard.log; then
            echo "HIBA: a build elszállt, de nem a várt okból."
            cat guard.log
            exit 1
          fi
          echo "Rendben: cím nélkül a kiadási build megáll."

      # A kiadási build eddig SEHOL nem futott le. Pedig csak ott fut az R8: a
      # kódzsugorítás reflexióval elért osztályokat tud kidobni, tehát a szerializáció
      # vagy a Room a boltba feltöltött csomagban romlana el először, debugban soha.
      # Aláíró kulcs nélkül aláíratlan APK készül — a Play nem fogadná el, de az R8
      # ugyanúgy végigfut rajta, és ez itt a lényeg.
      - name: Kiadási build (R8 próba)
        env:
          MEALPILOT_BACKEND_URL: https://ci.example.invalid
        run: ./gradlew :app:assembleRelease --stacktrace

      # A séma a build könyvtárában keletkezik, és a futás végén eltűnik. Letölteni
      # a csomagot nem mindig lehet (a letöltés blob-tárolóra irányít át, amit
      # hálózati szabály blokkolhat), ezért a tartalma a NAPLÓBA is kikerül: onnan
      # bármikor visszaolvasható és verziókezelésbe tehető. Néhány kilobájt.
      - name: Adatbázis-séma kiírása
        if: success()
        run: |
          for f in app/schemas/*/*.json; do
            echo "=== $f ==="
            cat "$f"
            echo
          done

      # A Room a fordításkor kiírja az adatbázis pontos sémáját. Ez nincs a repóban,
      # pedig a következő verzió migrációját EHHEZ kell írni: enélkül csak tippelni
      # lehetne, milyen táblák vannak a felhasználók telefonján. Amíg nincs bekötve a
      # verziókezelésbe, legalább legyen letölthető minden futásból.
      - name: Adatbázis-séma feltöltése
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: android/app/schemas
          if-no-files-found: warn

      - name: APK feltöltése
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mealpilot-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Riportok hiba esetén
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            android/*/build/reports
            android/*/build/test-results
          if-no-files-found: ignore

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Függőségek
        run: npm ci

      - name: Típusellenőrzés
        run: npm run typecheck

      - name: Tesztek
        run: npm test
