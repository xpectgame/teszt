name: Backend deploy

# A Cloudflare Workerre való kiadás. Kézzel indul a GitHub felületéről
# (Actions → Backend deploy → Run workflow), böngészőből is, telefonról is —
# nem kell hozzá semmit telepíteni a gépre.
#
# Két repository secret kell hozzá (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — Cloudflare → My Profile → API Tokens → Edit Cloudflare Workers
#   CLOUDFLARE_ACCOUNT_ID — a Cloudflare dashboard URL-jében szereplő azonosító
#
# A Worker saját titkai (ANTHROPIC_API_KEY, OWNER_KEY, PLAY_SERVICE_ACCOUNT_JSON,
# RTDN_SHARED_SECRET) NEM ide tartoznak. Azokat a Cloudflare dashboardon állítsd be
# a Workernél — így nem kerülnek át a GitHubra.
on:
  workflow_dispatch:
    inputs:
      migrations:
        description: "Migrációk futtatása az éles D1 adatbázison a deploy előtt"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Függőségek
        run: npm ci

      - name: Típusellenőrzés
        run: npm run typecheck

      - name: Tesztek
        run: npm test

      # A src/pages.ts generált fájl. Ha valaki a mealpilot/ alatti HTML-t szerkesztette,
      # de nem futtatta a generátort, akkor a régi szöveg menne élesbe — itt bukik el.
      - name: Generált oldalak naprakészek
        run: |
          npm run pages
          if ! git diff --quiet -- src/pages.ts; then
            echo "::error::A src/pages.ts nem naprakész. Futtasd: npm run pages — és commitold."
            git diff --stat -- src/pages.ts
            exit 1
          fi

      - name: Az adatbázis azonosítója be van írva
        run: |
          if grep -q "PASTE_D1_DATABASE_ID_HERE" wrangler.toml; then
            echo "::error::A wrangler.toml-ban még a helykitöltő szerepel. Írd be a D1 database_id-t."
            exit 1
          fi

      # Ha a token jogosultságai hiányosak, a Cloudflare csak egy 7403-as kódot ad
      # vissza, ami nem árulja el, MI hiányzik. Ez a lépés kiírja, melyik fiókot
      # látja a token és milyen engedélyekkel — így a hiba magától megmondja magát.
      - name: A token jogosultságai
        run: npx wrangler whoami
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"

      - name: Migrációk
        if: inputs.migrations
        run: npx wrangler d1 migrations apply mealpilot --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
