org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# A konfigurációs cache-t szándékosan nem kapcsoljuk be: a KSP/Room kódgenerálással
# egyes verziókban akadozik, és a hibaüzenetei nehezen olvashatók.
# org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# A kiadott Cloudflare Worker címe. Ezt hívja az app az AI-tervekért, és ez
# szolgálja ki a jogi oldalakat is, amelyekre a Play kötelezően hivatkozik.
# Környezeti változóval felülírható: MEALPILOT_BACKEND_URL.
mealpilot.backendUrl=https://mealpilot-backend.mealpilot.workers.dev
